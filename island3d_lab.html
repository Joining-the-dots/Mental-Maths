<!DOCTYPE html>
<html lang="en">
<head>

<title>Island 3D Lab</title>
<!-- DEV ONLY — My Island 3D QA lab (island architecture chunk 16). Not linked from the app and
     not precached by sw.js. Serve the repo root (python3 -m http.server 8000) and open
     /island3d_lab.html. Modes: ?mode=showcase (default) | ?item=<id> | ?mode=pets | ?mode=karts |
     ?mode=env | ?mode=island (&fixture=starter|max|showcase). See island3d_lab_core.js for every
     URL parameter. The import map below is the same as index.html's (three r170 from jsDelivr). -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&family=Bagel+Fat+One&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2B2140; --ink2: #5B4F7A; --glass: rgba(255,255,255,0.78); --glass-solid: #FFF8FD; --edge: rgba(255,255,255,0.9);
    --chip: #FFFFFF; --chip-ink: #2B2140; --well: rgba(43,33,64,0.06);
    --ok: #1C8F57; --warn: #A86400; --over: #C8283A; --gold: #FFD23F;
    --sky: linear-gradient(180deg, #8FD3FF 0%, #CDEBFF 55%, #FFE3F1 100%);
  }
  body.showtime {
    --ink: #FFFFFF; --ink2: #D9D2FF; --glass: rgba(26,18,64,0.72); --glass-solid: #1A1240; --edge: rgba(255,255,255,0.25);
    --chip: rgba(255,255,255,0.12); --chip-ink: #FFFFFF; --well: rgba(255,255,255,0.08);
    --ok: #5CE6A0; --warn: #FFC24D; --over: #FF8A96;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #FFF8FD; color: var(--ink); font: 500 14px/1.4 'Fredoka', system-ui, -apple-system, sans-serif; overflow: hidden; }
  body.showtime { background: #130C2E; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #app { display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr); height: 100vh; height: 100dvh; }
  .glass { background: var(--glass); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
           border: 1.5px solid var(--edge); border-radius: 22px; box-shadow: 0 10px 30px rgba(43,33,64,0.16); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: var(--glass-solid); } }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin: 8px 8px 0; min-width: 0; }
  header h1 { margin: 0; font: 400 22px/1 'Bagel Fat One', system-ui, sans-serif; letter-spacing: 0.5px; white-space: nowrap;
              background: linear-gradient(135deg, #FF5FA2, #A66BFF); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #modes { display: flex; gap: 6px; overflow-x: auto; min-width: 0; flex: 1; padding: 4px 2px; scrollbar-width: none; }
  #status { font: 700 12px/1 'Baloo 2', sans-serif; padding: 7px 12px; border-radius: 999px; background: var(--well); white-space: nowrap; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; }
  #stage { position: relative; overflow: hidden; margin: 8px; border-radius: 22px; background: var(--sky); min-height: 0; touch-action: none; }
  #stage canvas.lab-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #mountHost { position: absolute; inset: 0; }
  #mountHost[hidden] { display: none; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #labels.off .tag { display: none !important; }
  .tag { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; font: 700 11px/1.15 'Baloo 2', sans-serif;
         padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,0.94); color: #2B2140; border: 2px solid #FFFFFF;
         box-shadow: 0 2px 6px rgba(43,33,64,0.2); white-space: nowrap; will-change: transform; }
  .tag .b { margin-left: 4px; padding: 0 5px; border-radius: 999px; font-size: 10px; background: #EDE8F7; color: #4F4870; }
  .tag .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 4px; border: 1px solid #2B2140; vertical-align: -1px; }
  .tag.ph { background: #FFE3F1; border: 2px dashed #E0408A; color: #8E1650; }
  .tag.err { background: #FFE0E0; border-color: #C8283A; }
  .tag.over .t { color: #C8283A; }
  .tag.sel { outline: 3px solid var(--gold); outline-offset: 1px; }
  .tag.hdr { cursor: default; background: none; border: none; box-shadow: none; padding: 0; font: 400 16px/1 'Bagel Fat One', system-ui, sans-serif;
             color: #2B2140; text-shadow: 0 2px 0 #FFFFFF, 0 0 6px #FFFFFF; pointer-events: none; }
  body.showtime .tag.hdr { color: #FFFFFF; text-shadow: 0 2px 0 #3B1E6E, 0 0 8px #A66BFF; }
  #msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: min(440px, 86%); padding: 16px 18px; text-align: center; z-index: 5; }
  #msg h2 { margin: 0 0 6px; font: 400 20px/1.1 'Bagel Fat One', system-ui, sans-serif; }
  #msg p { margin: 4px 0; color: var(--ink2); }
  #note { position: absolute; left: 10px; top: 10px; right: 10px; padding: 7px 12px; font-size: 12px; z-index: 4; border-radius: 16px; }
  #cues { position: absolute; left: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 3px; pointer-events: none; z-index: 3; }
  #cues span { font: 700 11px/1 'Baloo 2', sans-serif; padding: 4px 8px; border-radius: 999px; background: rgba(43,33,64,0.62); color: #FFFFFF; transition: opacity 600ms; }
  #panel { margin: 8px 8px 8px 0; padding: 10px; overflow-y: auto; overflow-x: hidden; min-height: 0; }
  #panelToggle { display: none; }
  .card { padding: 8px 4px 10px; border-bottom: 1px solid var(--well); }
  .card:last-child { border-bottom: 0; }
  .card h2 { margin: 0 0 6px; font: 800 12px/1.2 'Baloo 2', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
  .row > label { font: 700 12px/1.2 'Baloo 2', sans-serif; color: var(--ink2); min-width: 62px; }
  .chip, .btn { min-height: 36px; padding: 6px 12px; border-radius: 18px; border: 3px solid #FFFFFF; background: var(--chip); color: var(--chip-ink);
                font: 700 13px/1 'Baloo 2', sans-serif; cursor: pointer; box-shadow: 0 3px 0 #D8D0EA, 0 6px 14px rgba(43,33,64,0.14);
                transition: transform 180ms ease-out, box-shadow 180ms ease-out; white-space: nowrap; }
  body.showtime .chip, body.showtime .btn { border-color: rgba(255,255,255,0.55); box-shadow: 0 3px 0 rgba(0,0,0,0.35), 0 0 12px rgba(166,107,255,0.35); }
  .chip:active, .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #D8D0EA; }
  .chip[aria-pressed="true"], .btn.primary { background: linear-gradient(135deg, #E0408A, #8F55F0); color: #FFFFFF; box-shadow: 0 3px 0 #9B2E7A, 0 6px 14px rgba(43,33,64,0.18); }
  .btn.secondary { background: linear-gradient(135deg, #2BA9D6, #5A66E8); color: #FFFFFF; box-shadow: 0 3px 0 #3A46B0, 0 6px 14px rgba(43,33,64,0.18); }
  .chip[aria-pressed="true"]::before { content: '✓ '; }
  .chip:disabled, .btn:disabled { background: #E4E0EE; color: #4F4870; cursor: not-allowed; box-shadow: none; transform: none; }
  .chip.sm { min-height: 30px; padding: 4px 9px; font-size: 12px; }
  #modes .chip[aria-pressed="true"]::before { content: ''; }
  select, input[type="text"] { min-height: 36px; padding: 4px 10px; border-radius: 14px; border: 2px solid var(--edge); background: var(--chip); color: var(--chip-ink); max-width: 100%; }
  select option { color: #2B2140; }
  input[type="range"] { flex: 1; min-width: 120px; accent-color: #E0408A; }
  input[type="color"] { width: 40px; height: 32px; border: 2px solid #FFFFFF; border-radius: 10px; padding: 0; background: none; }
  table.stats { width: 100%; border-collapse: collapse; font: 600 12px/1.3 'Baloo 2', sans-serif; }
  table.stats td { padding: 3px 4px; border-bottom: 1px dashed var(--well); }
  table.stats td.v { text-align: right; font-variant-numeric: tabular-nums; }
  .lv { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: #B8B0CC; }
  .lv.ok { background: var(--ok); } .lv.warn { background: var(--warn); } .lv.over { background: var(--over); }
  tr.over td, li.over { color: var(--over); font-weight: 700; } tr.warn td, li.warn { color: var(--warn); }
  li.ok { color: var(--ok); }
  ul.list { margin: 4px 0; padding-left: 18px; font-size: 12px; }
  ul.list li { margin: 2px 0; overflow-wrap: anywhere; }
  .small { font-size: 12px; color: var(--ink2); overflow-wrap: anywhere; }
  .mono { font: 600 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .icon2d { width: 92px; height: 92px; flex: none; border-radius: 16px; background: radial-gradient(#FFF0FA, #E8F4FF); padding: 6px; border: 2px solid #FFFFFF; }
  .icon2d svg { width: 100%; height: 100%; }
  .swatches { display: flex; flex-wrap: wrap; gap: 4px; }
  .swatches span { display: inline-flex; align-items: center; gap: 4px; font: 600 11px/1 'Baloo 2', sans-serif; padding: 3px 6px 3px 3px; border-radius: 999px; background: var(--well); }
  .swatches i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #2B2140; }
  .shot { max-width: 100%; border-radius: 14px; border: 2px solid #FFFFFF; margin-top: 6px; display: block; }
  .files { columns: 2; column-gap: 10px; }
  .files div { break-inside: avoid; }
  @media (max-width: 820px) {
    body { overflow: auto; }
    #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(52vh, 1fr) auto; height: auto; min-height: 100dvh; }
    header { margin: 8px 16px 0; padding: 6px 10px; }
    header h1 { font-size: 18px; }
    #status { display: none; }
    #stage { margin: 8px 16px; height: 56vh; }
    #panel { margin: 0 16px 16px; max-height: none; }
    #panel.collapsed > .card { display: none; }
    #panelToggle { display: inline-flex; }
    .files { columns: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .chip, .btn { transition: opacity 120ms; } }
</style>
</head>
<body>
<div id="app">
  <header class="glass">
    <h1>Island Lab</h1>
    <nav id="modes" aria-label="Lab mode"></nav>
    <span id="status" role="status">Loading…</span>
  </header>
  <main id="stage" aria-label="3D view">
    <div id="mountHost" hidden></div>
    <div id="labels"></div>
    <div id="note" class="glass" hidden></div>
    <div id="cues" aria-live="polite"></div>
    <div id="msg" class="glass" hidden></div>
  </main>
  <aside id="panel" class="glass" aria-label="Lab controls">
    <button id="panelToggle" class="chip" type="button" aria-expanded="true">⚙️ Panel</button>
    <section class="card" id="secView"><h2>View</h2></section>
    <section class="card" id="secMode"><h2>Mode</h2></section>
    <section class="card" id="secInfo"><h2>Inspect</h2><p class="small">Tap an item or its label.</p></section>
    <section class="card" id="secStats"><h2>Stats</h2></section>
    <section class="card" id="secFiles"><h2>Files &amp; issues</h2></section>
    <section class="card" id="secTools"><h2>Tools</h2></section>
  </aside>
</div>
<noscript><p style="padding:20px">The Island 3D Lab needs JavaScript.</p></noscript>

<script>
window.SL_WORLD_VER = '1';
/* verbatim copy of index.html's 3D loader (resolves THREE through the import map, or null) */
(function () {
  var p = null;
  window.slLoad3D = function () {
    if (p) return p;
    p = new Promise(function (resolve) {
      try { if (localStorage.getItem('slNo3D') === '1') return resolve(null); } catch (e) {}
      var ok = false;
      try { var c = document.createElement('canvas'); ok = !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) {}
      if (!ok) return resolve(null);
      var done = false, timer = setTimeout(function () { if (!done) { done = true; resolve(null); } }, 15000);
      var imp;
      try { imp = new Function('return import("three")')(); } catch (e) { imp = Promise.reject(e); }
      imp.then(function (T) { if (!done) { done = true; clearTimeout(timer); resolve(T); } })
        .catch(function () { if (!done) { done = true; clearTimeout(timer); resolve(null); } });
    });
    return p;
  };
})();
</script>
<script src="island3d_lab_core.js"></script>
<script id="labMain">
/* ================================================================
   Island 3D Lab — the page controller (classic script; THREE only via SL3D.THREE).
   Boot: world-core, world-art, world-look, games/fx, sound → island3d/stage.js →
   SLIsland3D.ensure(). Every mode builds from SL3D.make / SL3D.makeRig and degrades
   to placeholders or lab stand-ins when another branch's file is missing.
   Automation: window.labShot(opts) → data URL; window.lab (state, setMode, set, act,
   stats, memoryCycle, ready).
   ================================================================ */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var LAB = window.SLIslandLab;
  if (!LAB) { showMsg('Lab helpers missing', 'island3d_lab_core.js did not load.'); return; }

  var P = LAB.parseParams(location.search);
  var D2R = Math.PI / 180;
  var MEDIA_REDUCED = false;
  try { MEDIA_REDUCED = !!window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  var S = {
    mode: P.mode, item: P.item, st: P.st, tier: null, tierPinned: !!P.tier, show: P.show,
    reduced: P.reduced == null ? MEDIA_REDUCED : P.reduced, wire: P.wire, outlines: P.outlines, shadows: P.shadows,
    idle: P.idle, spin: P.spin, sound: P.sound, labels: true, fixture: P.fixture, engine: P.engine, sim: P.sim,
    clip: P.clip, playAll: false, speed: 1, intensity: 1, acc: P.acc, driver: false, driverPet: 'pet_puppy',
    member: '#FF5FA2', timeScale: 1, fresh: P.fresh
  };
  var G = {};            /* SL3D, THREE, K, C, L, M, T, Grid, ART, Orbit */
  var R = {
    renderer: null, scene: null, camera: null, controls: null, hemi: null, sun: null, fx: null, view: null,
    t: 0, last: 0, width: 1, height: 1, info: { calls: 0, tris: 0 }, labels: [], selected: null, shake: null,
    showAnim: null, lostCount: 0, issues: [], issuesDirty: true, fixtures: {}, lit: {}, wireMats: new Set(),
    lastStats: 0, fatal: false, home: null, statsTimer: 0, fallbackTpl: {}
  };
  var meter = LAB.fpsMeter(60), workAvg = 0;
  var readyResolve;
  var readyP = new Promise(function (res) { readyResolve = res; });
  var CTRL_ACTS = { squish: 1, dropIn: 1, debut: 1, store: 1, hop: 1 };
  /* the kit's shared materials (wireframe on a mounted island, whose scene the lab can't reach) */
  var KIT_MAT_KEYS = ['toon', 'gold', 'chrome', 'pearl', 'glass', 'state', 'ink', 'blob', 'outline:0.018', 'outline:0.012'];

  /* ---------------- small helpers ---------------- */
  function msgOf(e) { return e && e.message ? e.message : String(e); }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function labIssue(text) {
    if (R.issues.indexOf(text) >= 0) return;          /* once per message (rebuilds repeat them) */
    R.issues.push(text);
    if (R.issues.length > 80) R.issues.shift();
    R.issuesDirty = true;
    if (window.console) console.warn('[lab] ' + text);
  }
  function safe(fn, what) { try { return fn(); } catch (e) { labIssue((what || 'lab') + ': ' + msgOf(e)); return undefined; } }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k === 'class') n.className = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : String(v));
    });
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); return node; }
  function setStatus(t) { $('status').textContent = t; }
  function showMsg(title, text, extra) {
    var m = $('msg');
    clear(m);
    m.appendChild(el('h2', { text: title }));
    (Array.isArray(text) ? text : [text]).forEach(function (t) { if (t) m.appendChild(el('p', { text: t })); });
    if (extra) m.appendChild(extra);
    m.hidden = false;
  }
  function hideMsg() { $('msg').hidden = true; }
  var swWarning = '';
  function note(text) { var n = $('note'), t = text || swWarning; n.textContent = t; n.hidden = !t; }
  function cue(text) {
    var box = $('cues'), s = el('span', { text: text });
    box.appendChild(s);
    while (box.children.length > 6) box.removeChild(box.firstChild);
    setTimeout(function () { s.style.opacity = '0'; }, 1800);
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 2500);
  }
  function rng(seed) {                    /* mulberry32 */
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function loadScript(src) {
    return new Promise(function (res) {
      var s = document.createElement('script');
      s.src = src; s.async = false;
      s.onload = function () { res(true); };
      s.onerror = function () { res(false); };
      document.head.appendChild(s);
    });
  }
  var dynImport = (function () {
    try { var f = new Function('u', 'return import(u)'); return function (u) { try { return f(u); } catch (e) { return Promise.reject(e); } }; }
    catch (e) { return function () { return Promise.reject(new Error('dynamic import unavailable')); }; }
  }());
  function updateURL() {
    var q = LAB.toQuery({
      mode: S.mode, item: S.item, st: S.st, tier: S.tierPinned ? S.tier : null, show: S.show,
      reduced: S.reduced === MEDIA_REDUCED ? null : S.reduced, wire: S.wire, outlines: S.outlines, shadows: S.shadows,
      idle: S.idle, spin: S.spin, sound: S.sound, fixture: S.fixture, engine: S.engine, sim: S.sim, clip: S.clip, acc: S.acc, fresh: S.fresh
    });
    try { history.replaceState(null, '', location.pathname + q); } catch (e) {}
  }

  /* ================================================================
     BOOT
     ================================================================ */
  var VQ = '?v=' + (P.fresh ? 'lab' + Date.now() : (window.SL_WORLD_VER || '1'));
  var bootFiles = ['world/world-core.js', 'world/world-art.js', 'world/world-look.js', 'world/games/fx.js', 'world/sound.js'];
  var bootStatus = {};
  var simCleanup = null;
  function boot() {
    buildModeTabs();
    swCheck();
    setStatus('Loading scripts…');
    Promise.all(bootFiles.map(function (f) { return loadScript(f + VQ); })).then(function (ok) {
      bootFiles.forEach(function (f, i) { bootStatus[f] = ok[i]; });
      if (!window.SLWorldCore || !window.SLIslandLook) throw new Error('world-core.js / world-look.js did not load');
      return loadScript('world/island3d/stage.js' + VQ);
    }).then(function (ok) {
      bootStatus['world/island3d/stage.js'] = ok;
      if (!ok || !window.SLIsland3D || typeof window.SLIsland3D.ensure !== 'function') throw new Error('world/island3d/stage.js did not load');
      applySim();
      setStatus('Loading three r170 + island3d…');
      return window.SLIsland3D.ensure({ tier: P.tier || undefined, deadlineMs: 25000 });
    }).then(function (sl3d) {
      if (simCleanup) { simCleanup(); simCleanup = null; }
      if (!sl3d) return unavailable();
      return start(sl3d);
    }).catch(function (e) {
      if (simCleanup) { simCleanup(); simCleanup = null; }
      setStatus('Boot failed');
      showMsg('Boot failed', [msgOf(e), 'Serve the repo root over http (python3 -m http.server 8000).']);
      readyResolve(false);
    });
  }
  /* ?sim=no3d: the CDN / WebGL path fails; ?sim=slNo3D: the parent switch (restored after boot,
     so the real app on this origin is never affected) */
  function applySim() {
    if (S.sim === 'no3d') window.slLoad3D = function () { return Promise.resolve(null); };
    if (S.sim === 'slNo3D') {
      var prev = null;
      try { prev = localStorage.getItem('slNo3D'); localStorage.setItem('slNo3D', '1'); } catch (e) {}
      simCleanup = function () { try { if (prev == null) localStorage.removeItem('slNo3D'); else localStorage.setItem('slNo3D', prev); } catch (e) {} };
    }
  }
  function unavailable() {
    var why = (window.SLIsland3D && window.SLIsland3D.failed && window.SLIsland3D.failed()) || 'unknown';
    setStatus('3D unavailable: ' + why);
    var back = el('button', { type: 'button', class: 'btn primary', text: 'Reload without the simulation',
      onclick: function () { S.sim = null; updateURL(); location.reload(); } });
    showMsg('3D unavailable', ['SLIsland3D.ensure() resolved null (' + why + ').',
      S.sim ? 'This is the ' + S.sim + ' simulation: the app would show its 2D island silently.' : 'The app would stay on its 2D island silently.'], S.sim ? back : null);
    renderFiles();
    readyResolve(false);
  }
  function start(sl3d) {
    G.SL3D = sl3d; G.THREE = sl3d.THREE; G.C = window.SLWorldCore; G.L = window.SLIslandLook; G.M = window.SLMotion;
    G.T = window.SLTier; G.Grid = window.SLGrid3D; G.ART = window.SLWorldArt;

    /* a cosmetic with its own model (a kart, a ball) switches item; slots on a base item restyle it */
    if (own) {
      var mine = opts.filter(function (o) { return o.slot === it.slot; })[0];
      if (mine) sec.appendChild(el('div', { class: 'row' }, [el('label', { text: mine.label }),
        selectBox(null, mine.options.map(function (x) { return { value: x, label: x }; }), id, function (v) { S.item = v; S.st = null; updateURL(); rebuild(); }, mine.label)]));
      return;
    }
    var st = en.st || {};
    opts.forEach(function (o) {
      if (o.multi) {
        var row = el('div', { class: 'row' }, [el('label', { text: o.label })]);
        o.options.forEach(function (d) {
          row.appendChild(toggle(d.replace('detail_', ''), function () { return !!(st.details && st.details[d]); }, function (v) {
            var next = {}, cur = (S.st && S.st.details) || st.details || {};
            for (var k in cur) if (cur[k]) next[k] = true;
            if (v) next[d] = true; else delete next[d];
            S.st = S.st || {}; S.st.details = next; updateURL(); rebuild();
          }));
        });
        sec.appendChild(row);
      } else {
        sec.appendChild(el('div', { class: 'row' }, [el('label', { text: o.label }),
          selectBox(null, o.options.map(function (x) { return { value: x, label: x }; }), st[o.slot] || (G.C.DEFAULTS[o.slot] || ''), function (v) {
            S.st = S.st || {}; S.st[o.slot] = v; updateURL(); rebuild();
          }, o.label)]));
      }
    });
  }

  /* ---------------- stats ---------------- */
  function readStats() {
    var v = R.view;
    if (v && v.kind === 'mount') {
      var info = safe(function () { return v.stage.info ? v.stage.info() : null; }) || {};
      var li = info.lease || info.renderer || (G.SL3D.info().lease) || {};
      return { calls: li.calls, tris: li.tris, programs: li.programs, geometries: li.geometries, textures: li.textures, fps: li.fps, work: li.workMs, px: li.pixelRatio, source: 'mount' };
    }
    var r = R.renderer;
    if (!r) return null;
    return { calls: R.info.calls, tris: R.info.tris, programs: r.info.programs ? r.info.programs.length : 0,
             geometries: r.info.memory.geometries, textures: r.info.memory.textures, fps: Math.round(meter.fps() * 10) / 10,
             work: Math.round(workAvg * 100) / 100, px: r.getPixelRatio(), source: 'lab' };
  }
  function renderStats() {
    if (!G.SL3D) return;
    var st = readStats(), sec = clear($('secStats'));
    sec.appendChild(el('h2', { text: 'Stats' }));
    if (!st) { sec.appendChild(el('p', { class: 'small', text: 'No renderer.' })); return; }
    var scope = R.view ? R.view.scope : 'info';
    var rows = LAB.budgetRows(st, budgetForStats(), scope === 'item' ? 'info' : scope);
    var tb = el('table', { class: 'stats' });
    rows.forEach(function (r) {
      tb.appendChild(el('tr', { class: r.level }, [
        el('td', {}, [el('span', { class: 'lv ' + r.level }), r.label]),
        el('td', { class: 'v', text: r.value == null ? '—' : String(r.value) }),
        el('td', { class: 'v small', text: r.limit ? (r.key === 'fps' ? '≥ ' : '≤ ') + r.limit : '' })
      ]));
    });
    sec.appendChild(tb);
    var b = budgetForStats();
    sec.appendChild(el('div', { class: 'small', text: 'Work ' + (st.work != null ? st.work + ' ms' : '—') + ' · pixel ratio ' + (st.px || '—') +
      ' · outlines ' + (wantOutlines() ? 'on' : 'off') + ' · shadows ' + (wantShadows() ? 'on' : 'off') }));
    sec.appendChild(el('div', { class: 'small', text: 'Budget: ' + (b === G.SL3D.budget ? 'SL3D.budget' : 'SLTier.budget(' + S.tier + ')') + ' · scope ' + scope +
      (scope === 'info' || scope === 'item' ? ' (QA scene: only programs judged)' : scope === 'game' ? ' (game budgets)' : ' (island budgets)') +
      (st.source === 'lab' ? ' · incl. lab fx pools' : ' · shared lease') }));
    if (R.view && R.view.item && R.view.item.template) {
      var tp = R.view.item.template, look = G.L.LOOK[R.view.item.modelId] || {};
      sec.appendChild(el('div', { class: 'small' + (look.tris && tp.tris > look.tris ? ' over' : ''), text: 'Item: ' + tp.tris + ' / ' + (look.tris || '—') + ' tris (look budget, ' + S.tier + ')' }));
    }
  }
  /* ---------------- files, missing ids, issues ---------------- */
  function renderFiles() {
    R.issuesDirty = false;
    var sec = clear($('secFiles'));
    sec.appendChild(el('h2', { text: 'Files & issues' }));
    var files = el('div', { class: 'files small mono' });
    Object.keys(bootStatus).forEach(function (f) { files.appendChild(el('div', { text: (bootStatus[f] ? '✓ ' : '✗ ') + f })); });
    var loaded = (G.SL3D && G.SL3D.loaded) || {};
    Object.keys(loaded).forEach(function (f) {
      var v = loaded[f];
      files.appendChild(el('div', { text: (v === true ? '✓ ' : v === 'present' ? '• ' : '– ') + f.replace(/^\.\.\//, 'world/').replace(/^(?!world\/)/, 'island3d/') + (v === false ? ' (not built)' : '') }));
    });
    sec.appendChild(files);
    if (!G.SL3D) return;
    var info = safe(function () { return G.SL3D.info(); }) || {};
    sec.appendChild(el('div', { class: 'small', text: 'APIs: ' + ((info.apis || []).join(', ') || 'none yet') + ' · env: ' + (window.SLIslandEnv ? 'SLIslandEnv ✓' : '–') +
      ' · mount: ' + (window.SLIsland3D && window.SLIsland3D.mount ? '✓' : '–') + ' · models: ' + Object.keys(G.SL3D.models).length }));
    var miss = G.SL3D.missing || [];
    sec.appendChild(el('div', { class: 'small', text: 'SL3D.missing (' + miss.length + '): placeholder models' }));
    var mr = el('div', { class: 'row' });
    miss.slice(0, 60).forEach(function (id) {
      mr.appendChild(el('button', { type: 'button', class: 'chip sm', text: id, onclick: function () { S.item = id; S.st = null; setMode('item'); } }));
    });
    sec.appendChild(mr);
    var issues = (G.SL3D.issues || []).map(function (t) { return 'stage: ' + t; })
      .concat((info.kitIssues || []).map(function (t) { return 'kit: ' + t; }))
      .concat(R.issues.map(function (t) { return 'lab: ' + t; }));
    if (issues.length) {
      var ul = el('ul', { class: 'list mono' });
      issues.slice(-40).forEach(function (t) { ul.appendChild(el('li', { class: /threw|failed|missing|over|>/.test(t) ? 'warn' : '', text: t })); });
      sec.appendChild(ul);
    } else sec.appendChild(el('p', { class: 'small', text: 'No issues logged.' }));
  }

  /* ================================================================
     TOOLS: capture, context loss, fallback simulations, memory cycle
     ================================================================ */
  function labShot(opts) {
    opts = opts || {};
    var type = opts.type || 'image/png';
    if (R.view && R.view.kind === 'mount') {
      var c = $('mountHost').querySelector('canvas');
      try { return c ? c.toDataURL(type, opts.quality) : null; } catch (e) { return null; }   /* best effort: the stage's buffer may already be cleared */
    }
    if (!R.renderer || !R.scene) return null;
    R.renderer.render(R.scene, R.camera);
    var src = R.renderer.domElement;
    if (opts.bg === false) return src.toDataURL(type, opts.quality);
    var cv = document.createElement('canvas');
    cv.width = src.width; cv.height = src.height;
    var g = cv.getContext('2d'), pre = G.L.presetAt(S.show, S.member), grd = g.createLinearGradient(0, 0, 0, cv.height);
    grd.addColorStop(0, pre.skyTop); grd.addColorStop(0.55, pre.skyMid); grd.addColorStop(1, pre.skyHorizon);
    g.fillStyle = grd; g.fillRect(0, 0, cv.width, cv.height);
    g.drawImage(src, 0, 0);
    return cv.toDataURL(type, opts.quality);
  }
  window.labShot = labShot;
  function glOf() {
    var c = R.renderer ? R.renderer.domElement : $('mountHost').querySelector('canvas');
    if (!c) return null;
    var gl = null;
    try { gl = c.getContext('webgl2'); } catch (e) {}
    return gl ? gl.getExtension('WEBGL_lose_context') : null;
  }
  function loseContext(twice) {
    var ext = glOf();
    if (!ext) { labIssue('WEBGL_lose_context is not available'); renderFiles(); return; }
    ext.loseContext();
    setTimeout(function () {
      safe(function () { ext.restoreContext(); });
      if (twice) setTimeout(function () { safe(function () { ext.loseContext(); }); setTimeout(function () { safe(function () { ext.restoreContext(); }); }, 900); }, 1500);
    }, 900);
  }
  function onLost(e) {
    if (e && e.preventDefault) e.preventDefault();
    R.lostCount++;
    showMsg('Context lost (' + R.lostCount + ')', R.lostCount >= 2
      ? ['Second loss this session: the app would switch to 2D and remember it (localStorage slIsland3D).', 'Waiting for webglcontextrestored…']
      : ['The app stops, waits for webglcontextrestored, then disposes and remounts.']);
  }
  function onRestored() {
    cue('context restored');
    R.fatal = false;
    setTimeout(function () { hideMsg(); rebuild(); }, 100);
  }
  function memNow() {
    var r = R.renderer;
    if (r) return { geometries: r.info.memory.geometries, textures: r.info.memory.textures };
    var L = safe(function () { return G.SL3D.lease('lab-probe', {}); }, 'probe lease');
    if (!L) return null;
    var m = { geometries: L.renderer.info.memory.geometries, textures: L.renderer.info.memory.textures };
    L.release();
    return m;
  }
  function renderOnce() { if (R.renderer && R.scene) R.renderer.render(R.scene, R.camera); }
  function memoryCycle(n) {
    n = n || 20;
    var out = $('memOut');
    return new Promise(function (resolve) {
      var mount = R.view && R.view.kind === 'mount', i = 0, base = null, kit0 = null;
      function kitStats() { var k = safe(function () { return G.SL3D.info().kit; }) || {}; return JSON.stringify({ templates: k.templates, materials: k.materials, batches: k.batches, pools: k.pools }); }
      function once() { if (mount) { disposeView(); disposeRenderer(); R.view = mountIsland(); } else { rebuild(); renderOnce(); } }
      once();
      if (mount) { disposeView(); disposeRenderer(); }
      base = memNow(); kit0 = kitStats();
      if (mount) R.view = mountIsland();
      function step() {
        if (i++ < n) {
          if (out) out.textContent = 'cycle ' + i + ' / ' + n + '…';
          once();
          setTimeout(step, 30);
          return;
        }
        if (mount) { disposeView(); disposeRenderer(); }
        var after = memNow(), kit1 = kitStats();
        if (mount) R.view = mountIsland();
        var verdict = LAB.memoryVerdict(base, after);
        verdict.kitBefore = kit0; verdict.kitAfter = kit1; verdict.kitOk = kit0 === kit1;
        if (out) out.textContent = (verdict.ok && verdict.kitOk ? '✓ PASS' : '✗ LEAK?') + ' after ' + n + ' cycles · ' +
          verdict.rows.map(function (r) { return r.key + ' ' + r.base + '→' + r.after; }).join(' · ') + ' · kit ' + (verdict.kitOk ? 'stable' : kit0 + ' → ' + kit1);
        if (mount) { buildModePanel(); }
        resolve(verdict);
      }
      setTimeout(step, 30);
    });
  }
  function buildToolsPanel() {
    var sec = clear($('secTools'));
    sec.appendChild(el('h2', { text: 'Tools' }));
    var shotBox = el('div');
    sec.appendChild(el('div', { class: 'row' }, [
      el('button', { type: 'button', class: 'btn primary', text: '📸 Capture', onclick: function () {
        var url = labShot();
        clear(shotBox);
        if (!url) { shotBox.appendChild(el('p', { class: 'small', text: 'Nothing to capture.' })); return; }
        shotBox.appendChild(el('img', { class: 'shot', src: url, alt: 'Lab capture' }));
        shotBox.appendChild(el('a', { href: url, download: 'island3d-lab-' + S.mode + '-' + S.tier + '.png', class: 'small', text: 'Save PNG' }));
      } }),
      el('button', { type: 'button', class: 'btn secondary', text: '♻️ Memory ×20', onclick: function () { memoryCycle(20); } })
    ]));
    sec.appendChild(el('div', { id: 'memOut', class: 'small mono' }));
    sec.appendChild(el('div', { class: 'row' }, [
      el('button', { type: 'button', class: 'chip sm', text: 'Lose context', onclick: function () { loseContext(false); } }),
      el('button', { type: 'button', class: 'chip sm', text: 'Lose twice', onclick: function () { loseContext(true); } })
    ]));
    var simRow = el('div', { class: 'row' }, [el('label', { text: 'Fallback' })]);
    [['no3d', 'CDN / WebGL fail'], ['slNo3D', 'slNo3D = 1']].forEach(function (s) {
      simRow.appendChild(el('button', { type: 'button', class: 'chip sm', text: s[1], onclick: function () { S.sim = s[0]; updateURL(); location.reload(); } }));
    });
    sec.appendChild(simRow);
    sec.appendChild(shotBox);
    sec.appendChild(el('p', { class: 'small', text: 'window.labShot({bg, type}) → data URL · window.lab for automation.' }));
  }

  /* ---------------- automation surface ---------------- */
  window.lab = {
    ready: readyP, state: S,
    setMode: function (m) { setMode(m); },
    set: function (key, value) {
      if (key === 'tier') { setTier(value); return; }
      if (key === 'show') { applyShow(value); var r = $('showRange'); if (r) r.value = String(S.show); updateURL(); return; }
      S[key] = value;
      updateURL();
      if (key === 'wire') applyWire(); else if (key !== 'labels' && key !== 'sound' && key !== 'spin' && key !== 'idle' && key !== 'timeScale') rebuild();
      buildViewPanel();
    },
    item: function (id, st) { S.item = id; S.st = st || null; setMode('item'); },
    act: function (name, key) {
      var v = R.view, en = v && (key ? v.entries.filter(function (e) { return e.key === key || e.uid === key; })[0] : (v.item || R.selected || v.entries[0]));
      if (v && v.kind === 'mount') { safe(function () { v.stage.act(key, name); }); return; }
      startAct(en, name);
    },
    stats: function () { var s = readStats(); if (s) s.budget = LAB.budgetRows(s, budgetForStats(), R.view ? R.view.scope : 'info'); return s; },
    entries: function () { return R.view ? R.view.entries.map(function (en) { return { key: en.key, id: en.id, placeholder: !!en.placeholder, fallback: !!en.fallback, tris: en.template ? en.template.tris : null }; }) : []; },
    info: function () { return G.SL3D ? G.SL3D.info() : null; },
    issues: function () { return R.issues.slice(); },
    memoryCycle: memoryCycle, loseContext: loseContext, shot: labShot, rebuild: function () { rebuild(); }
  };

  boot();
}());
</script>
</body>
</html>
